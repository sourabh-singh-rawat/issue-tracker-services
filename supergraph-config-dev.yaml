federation_version: =2.8.1
subgraphs:
  attachment:
    # Use 127.0.0.1 (not localhost) so Node does not prefer IPv6 ::1 on Windows
    routing_url: http://127.0.0.1:4003/graphql
    schema:
      file: ./services/attachment/schema.graphql
  identity-service:
    routing_url: http://127.0.0.1:4001/graphql
    schema:
      file: ./services/identity-service/schema.graphql
  issue-tracker:
    routing_url: http://127.0.0.1:4002/graphql
    schema:
      file: ./services/issues/schema.graphql
