"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

"""
A field whose value conforms to the standard internet email address format as specified in HTML Spec: https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address.
"""
scalar EmailAddress

type Mutation {
  logout: String
  registerUser(input: RegisterUserInput!): String
  signInWithEmailAndPassword(input: SignInWithEmailAndPasswordInput!): Boolean
  verifyVerificationLink(input: VerifyVerificationLinkInput!): String
}

type Query {
  getCurrentUser: User
}

input RegisterUserInput {
  displayName: String!
  email: String!
  password: String!
}

input SignInWithEmailAndPasswordInput {
  email: String!
  password: String!
}

"""
A field whose value is a generic Universally Unique Identifier: https://en.wikipedia.org/wiki/Universally_unique_identifier.
"""
scalar UUID

type User {
  createdAt: DateTimeISO
  description: String
  displayName: String
  email: String
  emailVerificationStatus: String
  photoUrl: String
  userId: String
}

input VerifyVerificationLinkInput {
  token: String!
}