supergraph:
  listen: 127.0.0.1:4000

telemetry:
  instrumentation:
    spans:
      mode: spec_compliant

headers:
  all:
    request:
      - propagate:
          matching: .*

cors:
  origins:
    - https://localhost:3000
    - https://localhost:3001
    - https://localhost:3002
    - https://studio.apollographql.com
  allow_credentials: true

rhai:
  main: "cookies.rhai"
