services:
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      - DSN=postgresql://hydra:${POSTGRES_HYDRA_PASSWORD}@ory-postgres:5432/hydra?sslmode=disable
    volumes:
      - ./identity/hydra:/etc/config/hydra:ro
    command: migrate -c /etc/config/hydra/hydra.yaml sql up -e --yes
    restart: on-failure
    depends_on:
      ory-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      - DSN=postgresql://hydra:${POSTGRES_HYDRA_PASSWORD}@ory-postgres:5432/hydra?sslmode=disable
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM}
      - URLS_SELF_ISSUER=http://127.0.0.1:4444
      - LOG_LEVEL=debug
    command: serve -c /etc/config/hydra/hydra.yaml all --dev
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - ./identity/hydra:/etc/config/hydra:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
