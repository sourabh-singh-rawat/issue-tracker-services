services:
  ory-postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_KRATOS_PASSWORD=${POSTGRES_KRATOS_PASSWORD}
      - POSTGRES_HYDRA_PASSWORD=${POSTGRES_HYDRA_PASSWORD}
      - POSTGRES_KETO_PASSWORD=${POSTGRES_KETO_PASSWORD}
    volumes:
      - ../data/docker/pg-ory-data:/var/lib/postgresql
      - ./init-db/ory:/docker-entrypoint-initdb.d:ro
    ports:
      - 5440:5432
    command:
      - postgres
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
