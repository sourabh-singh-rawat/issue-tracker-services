services:
  postgres:
    image: postgres:18.4
    container_name: postgres-minimal
    restart: unless-stopped
    environment:
      # Admin role
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}

      # Service roles
      - POSTGRES_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD}
      - POSTGRES_ISSUES_PASSWORD=${POSTGRES_ISSUES_PASSWORD}
      - POSTGRES_MAIL_PASSWORD=${POSTGRES_MAIL_PASSWORD}
      - POSTGRES_ATTACHMENT_PASSWORD=${POSTGRES_ATTACHMENT_PASSWORD}
    volumes:
      - ./data/postgres-minimal-data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    command:
      - postgres
      - -c
      - max_connections=50

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    entrypoint: ["/pgadmin4/docker-entrypoint.sh"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_REPLACE_SERVERS_ON_STARTUP=True
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
      - PGPASS_FILE=/config/pgpass
    ports:
      - 5555:80
    volumes:
      - ./data/pgadmin-data:/var/lib/pgadmin
      - ./pgadmin:/pgadmin4
      - ./pgadmin/pgpass:/config/pgpass
