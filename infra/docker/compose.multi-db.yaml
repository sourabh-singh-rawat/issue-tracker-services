services:
  auth-postgres:
    image: postgres:18.4
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=${POSTGRES_AUTH_PASSWORD}
      - POSTGRES_DB=auth
    volumes:
      - ./data/auth-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50
    ports:
      - 5433:5432
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

