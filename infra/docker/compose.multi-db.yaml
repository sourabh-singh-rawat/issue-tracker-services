services:
  identity-postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=identity
      - POSTGRES_PASSWORD=${POSTGRES_IDENTITY_PASSWORD}
      - POSTGRES_DB=identity
    volumes:
      - ../data/docker/identity-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50
    ports:
      - 5433:5432
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  issues-postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=issues
      - POSTGRES_PASSWORD=${POSTGRES_ISSUES_PASSWORD}
      - POSTGRES_DB=issues
    volumes:
