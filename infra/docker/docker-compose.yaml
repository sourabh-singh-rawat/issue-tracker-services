services:
  auth-postgres:
    image: postgres:18.4
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5431:5432"
    volumes:
      - ./data/auth-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50

  issues-postgres:
    image: postgres:18.4
    container_name: issues-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/issues-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50

  mail-postgres:
    image: postgres:18.4
    container_name: mail-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./data/mail-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50

  attachment-postgres:
    image: postgres:18.4
    container_name: attachment-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./data/attachment-postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=50

  attachment-redis:
    image: redis:8.0-M02-alpine
    container_name: attachment-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --replica-read-only no
    ports:
      - 6380:6379

  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command:
      - -p
      - "4222"
      - -m
      - "8222"
      - -js

  issue-tracker-services-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: issue-tracker-services-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5555:80
    volumes:
      - ./data/pgadmin-data:/var/lib/pgadmin
